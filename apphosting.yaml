# Firebase App Hosting Configuration
# https://firebase.google.com/docs/app-hosting

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
  - variable: NODE_ENV
    value: "production"
  - variable: RUSHDB_MODE
    value: "fallback"
